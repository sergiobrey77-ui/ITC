<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="side">
      <h1>Welcome back</h1>
      <p>Log in to pick up where you left off.</p>
    </div>

    <div class="main">
      <h2>Log in</h2>
      <p class="sub">Enter your details below.</p>

      <form id="loginForm" novalidate>
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Your username" autocomplete="username">
        <div class="error" id="usernameError"></div>

        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
          <button type="button" class="toggle" id="toggle">Show</button>
        </div>
        <div class="error" id="passwordError"></div>

        <div class="row">
          <label class="check"><input type="checkbox" id="remember"> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit">Log in</button>
        <div class="success" id="msg"></div>

        <div class="divider">or continue with</div>
        <div class="social">
          <button type="button">Google</button>
          <button type="button">Facebook</button>
        </div>
      </form>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
